<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and take quizzes to test your knowledge.">
  <title>Quizzes - Readings in Philippine History</title>
  <link rel="icon" href="/IMAGES/favicon.png" type="image/png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/assignmentdetail.css">
  <link rel="stylesheet" href="/CSS/games-layout.css">
  <link rel="stylesheet" href="/CSS/quizlist.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/JS/auth.js"></script>
</head>
<body>
  <script type="module">
    import { supabase } from '/JS/supabase-auth.js';
    window.supabase = supabase;
    console.log('Supabase loaded globally');
  </script>

  <!-- Navigation Container -->
  <div id="nav-container"></div>
  
  <script type="module">
    import { loadNavigation } from '/JS/navigation-loader.js';
    
    loadNavigation('nav-container').then(() => {
      // Navigation loaded
    });
  </script>

  <main class="main-content">
    <div class="assignment-detail-container">
      <!-- Page Header -->
      <div class="assignment-header-card">
        <div class="assignment-header-content">
          <div>
            <h1 class="assignment-detail-title">Quizzes</h1>
            <div class="assignment-class-link">Test your knowledge with interactive quizzes</div>
          </div>
        </div>
      </div>

      <!-- Quizzes Section -->
      <section class="assignment-section">
        <div class="section-header">
          <svg data-lucide="help-circle" width="20" height="20"></svg>
          <h2>Available Quizzes</h2>
        </div>
        
        <div class="quiz-grid-layout">
          <!-- Quizzes List -->
          <div class="quiz-list-container">
            <div id="quizList" style="display: flex; flex-direction: column; gap: 12px;">
              <div style="padding: 32px 16px; text-align: center; color: #A0826D; font-size: 14px;">
                <svg data-lucide="loader" width="24" height="24" style="display: inline; margin-bottom: 8px; opacity: 0.5; animation: spin 1s linear infinite;"></svg>
                <div>Loading quizzes...</div>
              </div>
            </div>
          </div>

          <!-- Filters Sidebar -->
          <aside class="quiz-sidebar">
            <div style="background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(68, 41, 19, 0.08); border: 2px solid #E2D5C2;">
              <h3 style="font-weight: 700; margin-bottom: 16px; font-size: 14px; color: #51513E;">Filters & Search</h3>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                  <label for="qSearch" style="display: block; font-size: 12px; color: #5C3422; margin-bottom: 6px; font-weight: 600;">Search</label>
                  <input id="qSearch" type="text" placeholder="Search quizzes..." style="width: 100%; padding: 10px 14px; border: 2px solid #E2D5C2; border-radius: 10px; font-size: 13px; box-sizing: border-box; background: white; color: #3D3D3D; transition: all 0.3s ease; font-family: 'Poppins', sans-serif;" onmouseover="this.style.borderColor='#FF6B35'" onmouseout="this.style.borderColor='#E2D5C2'">
                </div>
                <div>
                  <label for="filterStatus" style="display: block; font-size: 12px; color: #5C3422; margin-bottom: 6px; font-weight: 600;">Status</label>
                  <select id="filterStatus" style="width: 100%; padding: 10px 14px; border: 2px solid #E2D5C2; border-radius: 10px; font-size: 13px; background: white; color: #3D3D3D; cursor: pointer; transition: all 0.3s ease; font-family: 'Poppins', sans-serif;" onmouseover="this.style.borderColor='#FF6B35'" onmouseout="this.style.borderColor='#E2D5C2'">
                    <option value="">All</option>
                    <option value="active">Active</option>
                    <option value="archived">Archived</option>
                  </select>
                </div>
                <div>
                  <label for="sortBy" style="display: block; font-size: 12px; color: #5C3422; margin-bottom: 6px; font-weight: 600;">Sort By</label>
                  <select id="sortBy" style="width: 100%; padding: 10px 14px; border: 2px solid #E2D5C2; border-radius: 10px; font-size: 13px; background: white; color: #3D3D3D; cursor: pointer; transition: all 0.3s ease; font-family: 'Poppins', sans-serif;" onmouseover="this.style.borderColor='#FF6B35'" onmouseout="this.style.borderColor='#E2D5C2'">
                    <option value="newest">Newest</option>
                    <option value="duedate">Due date</option>
                    <option value="title">Title</option>
                  </select>
                </div>
              </div>
            </div>

            <div style="background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(68, 41, 19, 0.08); border: 2px solid #FDC830; font-size: 13px; color: #7A5B47;">
              <div style="margin-bottom: 12px; font-weight: 700; color: #51513E; font-size: 14px;">Total Quizzes</div>
              <div style="font-size: 32px; font-weight: 800; color: #FF6B35;"><span id="quizCount">0</span></div>
            </div>
          </aside>
        </div>

        <!-- Pagination -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #E2D5C2;">
          <button id="prevPage" style="padding: 10px 16px; border: 2px solid #E2D5C2; border-radius: 10px; background: white; cursor: pointer; font-size: 13px; transition: all 0.3s ease; font-weight: 600; color: #5C3422; font-family: 'Poppins', sans-serif;" onmouseover="this.style.borderColor='#FF6B35'; this.style.background='#FFF8F0';" onmouseout="this.style.borderColor='#E2D5C2'; this.style.background='white';">
            <svg data-lucide="chevron-left" width="16" height="16" style="display: inline; margin-right: 4px; vertical-align: middle;"></svg>Prev
          </button>
          <span id="pageInfo" style="font-size: 13px; color: #7A5B47; font-weight: 600;">Page 1</span>
          <button id="nextPage" style="padding: 10px 16px; border: 2px solid #E2D5C2; border-radius: 10px; background: white; cursor: pointer; font-size: 13px; transition: all 0.3s ease; font-weight: 600; color: #5C3422; font-family: 'Poppins', sans-serif;" onmouseover="this.style.borderColor='#FF6B35'; this.style.background='#FFF8F0';" onmouseout="this.style.borderColor='#E2D5C2'; this.style.background='white';">
            Next<svg data-lucide="chevron-right" width="16" height="16" style="display: inline; margin-left: 4px; vertical-align: middle;"></svg>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Quiz Modal -->
  <div id="quizModal" class="quiz-modal">
    <div class="quiz-modal-content">
      <div class="quiz-modal-header">
        <h2 class="quiz-modal-title" id="quizTitle"></h2>
        <button class="quiz-modal-close" onclick="closeQuizModal()">×</button>
      </div>
      <div id="quizContent"></div>
    </div>
  </div>

  <script type="module" src="/JS/quizlist.js"></script>
</body>
</html>
