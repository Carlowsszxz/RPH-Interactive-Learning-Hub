<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign Up - Readings in Philippine History</title>
	<link rel="icon" href="../IMAGES/favicon.png" type="image/png">
	<link rel="stylesheet" href="../CSS/signup.css">
</head>
<body>
	<div class="signup-background">
		<div class="signup-container">
			<div class="signup-card">
				<div class="card-logo">
				<a href="FrameHero.html" class="logo-link">
					<img src="../IMAGES/favicon.png" alt="Logo" />
				</a>			</div>
				<div class="signup-header">
					<h1 class="signup-title">Create Account</h1>
					<p class="signup-subtitle">Join us to explore Philippine history with interactive lessons and challenges</p>
				</div>

				<div id="errorContainer" class="error-container"></div>

				<form id="signupForm" method="post" novalidate>
					<!-- Name Fields in Two Columns -->
					<div class="form-row">
						<div class="form-group">
							<label for="firstName">First Name</label>
							<input id="firstName" name="firstName" type="text" placeholder="James" required />
							<span class="error-message" id="firstNameError"></span>
						</div>
						<div class="form-group">
							<label for="lastName">Last Name</label>
							<input id="lastName" name="lastName" type="text" placeholder="Carter" required />
							<span class="error-message" id="lastNameError"></span>
						</div>
					</div>

					<!-- Email Field -->
					<div class="form-group">
						<label for="email">Email Address</label>
						<input id="email" name="email" type="email" placeholder="you@example.com" required />
						<span class="error-message" id="emailError"></span>
					</div>

					<!-- Username Field -->
					<div class="form-group">
						<label for="username">Username</label>
						<input id="username" name="username" type="text" placeholder="Choose your username" required />
						<span class="error-message" id="usernameError"></span>
					</div>

					<!-- Student ID Field -->
					<div class="form-group">
						<label for="studentId">Student ID <span class="optional">(optional)</span></label>
						<input id="studentId" name="studentId" type="text" placeholder="e.g. 2023-0001" />
						<span class="error-message" id="studentIdError"></span>
					</div>

					<!-- Password Field -->
					<div class="form-group">
						<label for="password">Password</label>
						<input id="password" name="password" type="password" placeholder="Create a strong password" required />
						<span class="error-message" id="passwordError"></span>
					</div>

					<!-- Confirm Password Field -->
					<div class="form-group">
						<label for="confirmPassword">Confirm Password</label>
						<input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" required />
						<span class="error-message" id="confirmPasswordError"></span>
					</div>

					<!-- Role Selection -->
					<div class="form-group">
						<label for="role">Role</label>
						<select id="role" name="role" required>
							<option value="">Select a role</option>
							<option value="student">Student</option>
							<option value="instructor">Instructor</option>
						</select>
						<span class="error-message" id="roleError"></span>
					</div>

					<!-- Terms Checkbox -->
					<div class="form-group terms-group">
						<label class="checkbox-label">
							<input id="terms" name="terms" type="checkbox" required />
							<span>I agree to the <a href="#" class="link">terms of service</a> and <a href="#" class="link">privacy policy</a></span>
						</label>
						<span class="error-message" id="termsError"></span>
					</div>

					<!-- Submit Button -->
					<button type="submit" id="signupBtn" class="btn-submit">Create Account</button>
				</form>

				<!-- Login Link -->
				<div class="signup-footer">
					Already have an account? <a href="FrameLogin.html" class="link">Log in</a>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="../JS/signup.js"></script>
</body>
</html>
