<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login - Readings in Philippine History</title>
	<link rel="icon" href="../IMAGES/favicon.png" type="image/png">
	<link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
	<div class="login-background">
		<div class="login-container">
			<div class="login-card">
				<div class="card-logo">
				<a href="FrameHero.html" class="logo-link">
					<img src="../IMAGES/favicon.png" alt="Logo" />
				</a>			</div>
				<div class="login-header">
					<h1 class="login-title">Welcome Back</h1>
					<p class="login-subtitle">Sign in to continue exploring Philippine history</p>
				</div>

				<div id="errorContainer" class="error-container"></div>

				<form id="loginForm" method="post" novalidate>
					<!-- Email/Username Field -->
					<div class="form-group">
						<label for="username">Email Address</label>
						<input id="username" name="username" type="email" placeholder="you@example.com" required />
						<span class="error-message" id="usernameError"></span>
					</div>

					<!-- Password Field -->
					<div class="form-group">
						<label for="password">Password</label>
						<input id="password" name="password" type="password" placeholder="Enter your password" required />
						<span class="error-message" id="passwordError"></span>
					</div>

					<!-- Remember Me Checkbox -->
					<div class="form-group remember-group">
						<label class="checkbox-label">
							<input id="remember" name="remember" type="checkbox" />
							<span>Remember me</span>
						</label>
					</div>

					<!-- Submit Button -->
					<button type="submit" id="loginBtn" class="btn-submit">Sign In</button>
				</form>

				<!-- Footer Links -->
				<div class="login-footer">
					Don't have an account? <a href="FrameSignup.html" class="link">Sign up</a>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="../JS/login.js"></script>
</body>
</html>
