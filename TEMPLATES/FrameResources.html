<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Class resources and materials">
  <title>Class Resources</title>
  <link rel="icon" href="/IMAGES/favicon.png" type="image/png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/home.css">
  <link rel="stylesheet" href="/CSS/games-layout.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .page-title {
      margin-bottom: 32px;
    }

    .resources-title {
      margin: 0 0 8px 0;
      font-size: 48px;
      font-weight: 800;
      color: #51513E;
      letter-spacing: -1px;
    }

    .resources-subtitle {
      margin: 0;
      font-size: 18px;
      color: #7A5B47;
      font-weight: 400;
    }

    .class-selector {
      margin-bottom: 32px;
    }

    .class-selector label {
      display: block;
      font-weight: 600;
      color: #5C3422;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .class-selector select {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 2px solid #E2D5C2;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: #3D3D3D;
      background: white;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .class-selector select:hover {
      border-color: #FF6B35;
    }

    .class-selector select:focus {
      outline: none;
      border-color: #FF6B35;
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    .selectors-group {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .selector-field {
      flex: 1;
      min-width: 250px;
    }

    .selector-field label {
      display: block;
      font-weight: 600;
      color: #5C3422;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .selector-field select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #E2D5C2;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: #3D3D3D;
      background: white;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .selector-field select:hover {
      border-color: #FF6B35;
    }

    .selector-field select:focus {
      outline: none;
      border-color: #FF6B35;
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    .filter-group {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 2px solid #E2D5C2;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: #5C3422;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      border-color: #FF6B35;
      background: #FFF8F0;
      color: #FF6B35;
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: #FF6B35;
      border-color: #FF6B35;
      color: white;
      box-shadow: 0 8px 16px rgba(255, 107, 53, 0.25);
    }

    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .resource-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #E2D5C2;
      box-shadow: 0 8px 24px rgba(68, 41, 19, 0.08);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
    }

    .resource-card:hover {
      transform: translateY(-12px);
      border-color: #FF6B35;
      box-shadow: 0 16px 32px rgba(212, 165, 116, 0.15);
    }

    .resource-card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFE4D1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .resource-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .resource-card-image.no-image {
      background: linear-gradient(135deg, #FF6B35, #FDC830);
      color: white;
    }

    .resource-card-image.no-image i {
      width: 48px;
      height: 48px;
    }

    .resource-card-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .resource-card-title {
      font-weight: 700;
      color: #51513E;
      margin-bottom: 8px;
      font-size: 16px;
      line-height: 1.3;
    }

    .resource-card-desc {
      font-size: 13px;
      color: #7A5B47;
      margin-bottom: 12px;
      flex: 1;
    }

    .resource-card-meta {
      font-size: 11px;
      color: #A0826D;
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      padding-top: 12px;
      border-top: 1px solid #E2D5C2;
    }

    .resource-card-action {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 10px 16px;
      border: 2px solid #E2D5C2;
      background: white;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      color: #5C3422;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
      text-decoration: none;
    }

    .btn:hover {
      border-color: #FF6B35;
      color: #FF6B35;
      background: #FFF8F0;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #FF6B35;
      color: white;
      border-color: #FF6B35;
    }

    .btn-primary:hover {
      background: #E55A1F;
      border-color: #E55A1F;
      color: white;
      box-shadow: 0 8px 16px rgba(255, 107, 53, 0.25);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #A0826D;
    }

    .empty-state-icon {
      width: 64px;
      height: 64px;
      color: #D4A574;
      margin: 0 auto 20px;
    }

    .empty-state-text {
      font-size: 18px;
      margin-bottom: 8px;
      color: #7A5B47;
      font-weight: 600;
    }

    .empty-state-subtext {
      font-size: 14px;
      color: #A0826D;
    }
  </style>
</head>
<body>
  <script type="module">
    import { supabase } from '/JS/supabase-auth.js';
    window.supabase = supabase;
  </script>

  <script type="module" src="/JS/auth.js"></script>

  <div id="nav-container"></div>

  <main class="main-content">
    <div class="home-container">
      <!-- Page Title -->
      <div class="page-title">
        <h1 class="resources-title">Class Resources</h1>
        <p class="resources-subtitle">Access materials shared by your instructors</p>
      </div>

      <!-- Class & Topic Selectors -->
      <div class="selectors-group">
        <div class="selector-field">
          <label for="classSelect">Select a Class</label>
          <select id="classSelect">
            <option value="">-- Choose a class --</option>
          </select>
        </div>
        <div class="selector-field">
          <label for="topicSelect">Select a Topic</label>
          <select id="topicSelect" disabled>
            <option value="">-- Choose a topic --</option>
          </select>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All Resources</button>
        <button class="filter-btn" data-filter="image">Images</button>
        <button class="filter-btn" data-filter="document">Documents</button>
        <button class="filter-btn" data-filter="video">Videos</button>
      </div>

      <!-- Resources Grid -->
      <div id="resourcesGrid" class="resources-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon">
          <i data-lucide="inbox"></i>
        </div>
        <div class="empty-state-text">No resources available</div>
        <div class="empty-state-subtext">Check back later for new materials</div>
      </div>
    </div>
  </main>

  <!-- Navigation Loading Script -->
  <script type="module">
    import { loadNavigation, setupLogout } from '/JS/navigation-loader.js';
    
    loadNavigation('nav-container').then(() => {
      setupLogout();
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });
  </script>

  <script type="module" src="/JS/resources.js"></script>
</body>
</html>
